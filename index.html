<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIVED Driver Portal</title>
  <meta http-equiv="refresh" content="0; url=https://driver-hub.hived.space/keyless">
  <link rel="canonical" href="https://driver-hub.hived.space/keyless">
  <script>window.location.replace("https://driver-hub.hived.space/keyless");</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0F1D21; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .redirect { display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; }
    .logo { font-size: 30px; font-weight: 700; color: #FFBE37; letter-spacing: 3px; }
    .logo-bar { display: inline-block; width: 3px; height: 23px; background: #FFBE37; vertical-align: middle; margin: 0 3px; transform: translateY(-1px); }
    .spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.12); border-top-color: #FFBE37; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message { font-size: 15px; color: rgba(255,255,255,0.55); }
    .fallback { font-size: 13px; color: rgba(255,255,255,0.3); }
    .fallback a { color: #BCDEEF; }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div class="redirect">
    <div class="logo">H<span class="logo-bar"></span>VED</div>
    <div class="spinner" role="status" aria-label="Redirecting"></div>
    <div class="message">Taking you to the driver hub&hellip;</div>
    <div class="fallback">If nothing happens, <a href="https://driver-hub.hived.space/keyless">continue here</a>.</div>
  </div>
</body>
</html>
